<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>QR</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; user-select: none; font-family: system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; -webkit-app-region: drag; cursor: move; }
  #qr { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #qr svg, #qr img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
  #bar { height: 22px; line-height: 22px; font-size: 12px; text-align: center; color: #fff; background: #1a7f37; white-space: nowrap; overflow: hidden; }
  #bar.warn { background: #b35900; }
  /* durum çubuğundaki küçük düğmeler (sağ alt tutamacın hemen solunda) */
  #ctl { position: fixed; right: 20px; bottom: 3px; display: flex; gap: 2px; z-index: 3; -webkit-app-region: no-drag; }
  #ctl button { width: 16px; height: 16px; padding: 0; border: 0; border-radius: 3px; background: rgba(255,255,255,.18); color: #fff;
    font: 11px/16px system-ui, "Segoe UI", sans-serif; cursor: pointer; opacity: .6; }
  #ctl button:hover { opacity: 1; background: rgba(255,255,255,.35); }
  #bar.bad { background: #b42318; }
  #wait { color: #666; font-size: 14px; padding: 12px; text-align: center; }
  /* köşe tutamaçları: fareyle üstüne gelince görünür */
  .grip { position: fixed; width: 18px; height: 18px; -webkit-app-region: no-drag; opacity: 0; transition: opacity .15s; z-index: 2; }
  body:hover .grip { opacity: .55; }
  .grip:hover { opacity: 1 !important; }
  .grip::after { content: ''; position: absolute; inset: 3px; border: 0 solid #0b6bcb; }
  .grip.tl { top: 0; left: 0; cursor: nwse-resize; } .grip.tl::after { border-width: 3px 0 0 3px; }
  .grip.tr { top: 0; right: 0; cursor: nesw-resize; } .grip.tr::after { border-width: 3px 3px 0 0; }
  .grip.bl { bottom: 0; left: 0; cursor: nesw-resize; } .grip.bl::after { border-width: 0 0 3px 3px; }
  .grip.br { bottom: 0; right: 0; cursor: nwse-resize; } .grip.br::after { border-width: 0 3px 3px 0; }
</style>
</head>
<body>
  <div id="qr"><div id="wait">QR bekleniyor…</div></div>
  <div id="bar">Yoklama QR</div>
  <div id="ctl"><button id="big" title="Tam ekran (Ctrl+Alt+B)">⛶</button><button id="min" title="Simge durumuna küçült (Ctrl+Alt+Q ile geri gelir)">–</button></div>
  <div class="grip tl" data-c="top-left"></div><div class="grip tr" data-c="top-right"></div>
  <div class="grip bl" data-c="bottom-left"></div><div class="grip br" data-c="bottom-right"></div>
<script>
  const box = document.getElementById('qr'), bar = document.getElementById('bar');
  window.qry.onQR((d) => {
    if (d.kind === 'svg') box.innerHTML = d.svg;          // kendi ürettiğimiz SVG
    else { const i = new Image(); i.src = d.src; box.replaceChildren(i); }
  });
  const bigBtn = document.getElementById('big');
  bigBtn.onclick = () => window.qry.toggleBig();
  document.getElementById('min').onclick = () => window.qry.hide();
  window.qry.onStatus((s) => {
    bigBtn.textContent = s.big ? '⤡' : '⛶'; bigBtn.title = s.big ? 'Köşeye geri al (Ctrl+Alt+B)' : 'Tam ekran (Ctrl+Alt+B)';
    const sec = (ms) => Math.round(ms / 1000);
    if (s.found) {
      bar.className = ''; bar.textContent = s.left != null ? `Canlı · ${s.left} sn` : 'Canlı';
    } else if (s.sinceSeen != null && s.sinceSeen < 8000) {
      bar.className = 'warn'; bar.textContent = 'QR yenileniyor…';
    } else {
      bar.className = 'bad'; bar.textContent = s.sinceSeen == null ? 'Sayfada QR bulunamadı' : `QR ${sec(s.sinceSeen)} sn'dir görünmüyor — eski olabilir`;
    }
  });
  // Köşeden boyutlandırma: fare pencere dışına çıksa da sürükleme devam etsin diye pointer capture
  for (const g of document.querySelectorAll('.grip')) {
    let x0, y0, on = false;
    g.addEventListener('pointerdown', (e) => {
      on = true; x0 = e.screenX; y0 = e.screenY; g.setPointerCapture(e.pointerId); window.qry.resizeStart(g.dataset.c);
    });
    g.addEventListener('pointermove', (e) => { if (on) window.qry.resizeMove(e.screenX - x0, e.screenY - y0); });
    const end = () => { if (on) { on = false; window.qry.resizeEnd(); } };   // bırakınca ya da iptal olunca
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) g.addEventListener(t, end);
  }
</script>
</body>
</html>
